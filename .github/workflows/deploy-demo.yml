name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 站点根目录 = demo/ 的内容本身，这样 demo 里的相对链接
      # （index.html / autumn.html / soe.html / intern.html）天然可用。
      # 不要把整个仓库当站点根上传，否则 .github、pages/ 都会被公网访问到。
      - name: Build site into _site
        run: |
          set -e
          rm -rf _site && mkdir -p _site
          cp demo/*.html _site/
          cp README.md _site/README.md
          touch _site/.nojekyll
          ls -R _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
