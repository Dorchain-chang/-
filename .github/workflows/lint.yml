name: Lint pages (sanity check)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 坑：不要把多行 python / JS 代码直接写进 `run: |` 块标量里 —— 顶格的代码
      # 行会被 YAML 当成块外内容，整个 workflow 直接解析失败（GitHub 的表现是
      # 0 个 job、不到 1 秒就挂的红色运行，没有日志）。多行脚本请放到 pages/ 下。

      - name: Check workflow YAML parses
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml || true
          python3 pages/check_workflows.py

      - name: Check inline JS syntax
        run: python3 pages/check_inline_js.py

      - name: Verify demo stays self-contained
        run: |
          for f in demo/*.html; do
            if ! grep -q "DEMO MODE ADAPTER" "$f"; then
              echo "FAIL $f 缺少 demo 适配层"
              exit 1
            fi
          done
          # demo 是纯静态站，导航不能指向生产环境（资料库）节点，否则一点就跳走
          if grep -q "workbuddy.cn/space/d/" demo/*.html; then
            echo "FAIL demo 里残留了生产环境链接"
            grep -n "workbuddy.cn/space/d/" demo/*.html || true
            exit 1
          fi
          # 生产页反过来必须保留真实的资料库 databaseId 字面量
          if ! grep -q "GgZ71tywhs4HEZytFSqXTP" "pages/00-总览台.html"; then
            echo "FAIL 生产页丢失了 databaseId 字面量"
            exit 1
          fi
          echo "OK  demo 自包含 / 生产页 databaseId 完整"

      - name: Verify merged app markers
        run: |
          # pages/00-总览台.html 是 build_single.py 产出的合并版单文件应用
          if ! grep -q 'data-view="soe"' "pages/00-总览台.html"; then
            echo "FAIL pages/00-总览台.html 不是合并版（缺少 data-view 切换）"
            exit 1
          fi
          # 合并版不应该再有任何跨节点跳转链接
          if grep -q "workbuddy.cn/space/d/" "pages/00-总览台.html"; then
            echo "FAIL pages/00-总览台.html 里还有生产环境跳转链接"
            exit 1
          fi
          echo "OK  合并版标记正确"

      - name: Verify generated files are up to date
        run: |
          set -e
          python3 pages/build_pages.py
          python3 pages/build_single.py
          python3 pages/build_demo.py
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if ! git diff --exit-code -- pages demo; then
            echo "FAIL pages/ 或 demo/ 与生成脚本不一致。请在本地跑："
            echo "    python3 pages/build_pages.py && python3 pages/build_single.py && python3 pages/build_demo.py"
            echo "  然后 git add pages demo 一起提交。"
            exit 1
          fi
          echo "OK  生成产物与脚本一致"

      - name: Verify page counts
        run: |
          prod=$(ls pages/*.html 2>/dev/null | wc -l)
          demo=$(ls demo/*.html 2>/dev/null | wc -l)
          if [ "$prod" -ne 4 ]; then echo "FAIL 期望 4 个生产页，实际 $prod"; exit 1; fi
          if [ "$demo" -ne 1 ]; then echo "FAIL 期望 1 个 demo 页（合并版单文件），实际 $demo"; exit 1; fi
          echo "OK  $prod 个生产页 / $demo 个 demo 页"
